<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嵌入式 Tab 页面切换</title>
    <style>
        /* 全局页面样式 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* 标签页容器样式 */
        .tab-container {
            display: flex;
            justify-content: center;
            margin-bottom: 0;
            background-color: #f1f1f1;
            padding: 10px 0;
        }

        /* 标签按钮样式 */
        .tab-button {
            background-color: #f1f1f1;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 12px 20px;
            font-size: 16px;
            margin: 0 5px;
            transition: background-color 0.3s;
            border-radius: 8px 8px 0 0;
        }

        /* 激活状态的标签 */
        .tab-button.active {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }

        /* 标签内容样式 */
        .tab-content {
            display: none;
            width: 100%;
            height: calc(100% - 50px); /* 去除顶部标签栏的高度 */
        }

        /* 显示标签内容时 */
        .tab-content.active {
            display: block;
        }

        /* iframe 样式 */
        .iframe-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fff;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<h1 style="text-align:center; margin-bottom: 20px;">后台</h1>

<!-- 标签页按钮 -->
<div class="tab-container">
    <button class="tab-button active" onclick="openTab('tab3')">商品页面</button>
    <button class="tab-button" onclick="openTab('tab1')">产品类型页面</button>
    <button class="tab-button" onclick="openTab('tab2')">仓库页面</button>
</div>

<!-- 标签内容 -->
<div class="iframe-container">
    <!-- 产品类型页面内容 -->
    <div id="tab1" class="tab-content">
        <iframe src="./product_type.html"></iframe>
    </div>

    <!-- 仓库页面内容 -->
    <div id="tab2" class="tab-content">
        <iframe src="./ware_host.html"></iframe>
    </div>

    <!-- 商品页面内容 -->
    <div id="tab3" class="tab-content active">
        <iframe src="./product.html"></iframe>
    </div>
</div>

<script>
    // 切换标签页
    function openTab(tabId) {
        // 获取所有标签按钮和内容
        const tabs = document.querySelectorAll('.tab-content');
        const buttons = document.querySelectorAll('.tab-button');

        // 隐藏所有标签内容，移除所有按钮的激活状态
        tabs.forEach(tab => tab.classList.remove('active'));
        buttons.forEach(button => button.classList.remove('active'));

        // 显示选中的标签内容，并设置按钮为激活状态
        document.getElementById(tabId).classList.add('active');
        document.querySelector(`button[onclick="openTab('${tabId}')"]`).classList.add('active');
    }
</script>

</body>
</html>
